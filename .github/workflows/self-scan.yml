name: self-scan

# The scanner runs against this repository and against the demo fixture.
#
# It exits non-zero only on an exposed secret, so this job is a secret gate
# rather than a compliance gate -- a missing privacy policy will not fail your
# build, and shouldn't. Use --fail-on blocking if you want the stricter
# behaviour in your own project.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The scanner skips lines that cannot match, for speed. If a needle set
      # ever stops covering its own service's identifiers, the scanner goes
      # quietly blind to that service -- no error, just a missing finding.
      # This is the regression guard for that.
      - name: Check the prescreen cannot hide a detection
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "launch-compliance/scripts")
          import scan

          missed = []
          for matcher, svc in zip(scan.build_service_matchers(), scan.SERVICES):
              if not matcher.needles:
                  continue  # empty means "always test", which is safe
              identifiers = svc["packages"] + svc["modules"] + svc["envs"] + svc["hosts"]
              for identifier in identifiers:
                  if scan.line_words(identifier).isdisjoint(matcher.needles):
                      missed.append(f"{svc['name']}: {identifier}")

          if missed:
              print("Identifiers the prescreen would skip before matching:")
              for item in missed:
                  print(f"  - {item}")
              sys.exit(1)
          print(f"Prescreen covers all identifiers for {len(scan.SERVICES)} services.")
          PY

      # A CI gate people wait on is a CI gate people delete.
      - name: Check the scanner is fast enough to sit in CI
        run: |
          python3 - <<'PY'
          import pathlib, random, string, subprocess, sys, tempfile, time

          random.seed(7)
          root = pathlib.Path(tempfile.mkdtemp()) / "bench"
          (root / "src").mkdir(parents=True)
          (root / "package.json").write_text('{"name":"b","dependencies":{"next":"^15.0.0"}}')
          for i in range(200):
              lines = [f"// module {i}", "import { useState } from 'react';"]
              for j in range(250):
                  blob = "".join(random.choice(string.ascii_letters) for _ in range(12))
                  lines.append(f"const value{j} = compute({j}, '{blob}');")
              (root / "src" / f"mod{i}.ts").write_text("\n".join(lines))

          start = time.perf_counter()
          subprocess.run(
              [sys.executable, "launch-compliance/scripts/scan.py", str(root), "--quiet"],
              check=True,
          )
          elapsed = time.perf_counter() - start
          print(f"50k lines scanned in {elapsed:.1f}s")
          if elapsed > 30:
              print("Too slow for a pre-deploy gate; something is scanning quadratically.")
              sys.exit(1)
          PY

      # No install step: the scanner is standard library only, and this job
      # is what keeps it that way.
      - name: Scan this repository
        run: |
          python3 launch-compliance/scripts/scan.py . \
            --out scan.json --report scan.md

      - name: Scan the demo fixture
        run: |
          python3 launch-compliance/scripts/scan.py examples/demo-project \
            --report demo-scan.md --quiet

      - name: Check the demo fixture still triggers its findings
        run: |
          python3 - <<'PY'
          import json, subprocess, sys

          subprocess.run(
              [sys.executable, "launch-compliance/scripts/scan.py",
               "examples/demo-project", "--out", "demo.json", "--quiet"],
              check=True,
          )
          found = {f["id"] for f in json.load(open("demo.json"))["findings"]}

          # If a detection stops firing on the fixture, it has regressed.
          expected = {
              "docs.privacy-policy-missing",
              "docs.terms-missing-with-payments",
              "docs.subprocessors-missing",
              "docs.cookie-policy-missing",
              "ai.provider-disclosure",
              "mechanism.deletion-missing",
              "launch.pre-ticked-consent",
              "launch.insecure-assets",
              "launch.robots-blocks-all",
              "launch.framework-title",
              "launch.og-tags-missing",
              "launch.twitter-tags-missing",
              "launch.canonical-missing",
              "launch.meta-description-missing",
              "launch.favicon-missing",
              "launch.manifest-missing",
              "launch.sitemap-missing",
              "a11y.img-missing-alt",
              "a11y.div-as-button",
              "a11y.focus-removed",
              "a11y.placeholder-as-label",
              "content.user-uploads",
              "risk.special-category",
          }
          missing = sorted(expected - found)
          if missing:
              print("Detections that stopped firing on the fixture:")
              for item in missing:
                  print(f"  - {item}")
              sys.exit(1)
          print(f"All {len(expected)} expected detections fired.")
          PY

      # The documents-that-exist checks. This fixture has a published privacy
      # policy that is out of date and omits four services in use -- the case
      # the skill treats as worse than having no policy at all.
      - name: Check the stale-docs fixture
        run: |
          python3 - <<'PY'
          import json, subprocess, sys

          subprocess.run(
              [sys.executable, "launch-compliance/scripts/scan.py",
               "examples/demo-stale-docs", "--out", "stale.json", "--quiet"],
              check=True,
          )
          report = json.load(open("stale.json"))
          found = {f["id"] for f in report["findings"]}

          expected = {
              "docs.policy-omits-service",
              "docs.placeholder-published",
              "docs.policy-stale",
              "docs.policy-undated",
          }
          missing = sorted(expected - found)
          if missing:
              print("Document-accuracy checks that stopped firing:")
              for item in missing:
                  print(f"  - {item}")
              sys.exit(1)

          # A policy that exists must NOT be reported as missing.
          if "docs.privacy-policy-missing" in found:
              print("Privacy policy exists but was reported missing.")
              sys.exit(1)

          # Services named in the policy, and local libraries, must not be
          # listed as omitted -- that is what makes the check trustworthy.
          omits = next(f for f in report["findings"] if f["id"] == "docs.policy-omits-service")
          for wrongly_flagged in ("Stripe", "Prisma"):
              if wrongly_flagged in omits["detail"]:
                  print(f"{wrongly_flagged} should not be reported as omitted.")
                  sys.exit(1)

          print(f"All {len(expected)} document-accuracy checks fired correctly.")
          PY

      # Cross-stack guard: the scanner must not be quietly Next.js-only.
      - name: Check the Django fixture
        run: |
          python3 - <<'PY'
          import json, subprocess, sys

          subprocess.run(
              [sys.executable, "launch-compliance/scripts/scan.py",
               "examples/demo-django", "--out", "django.json", "--quiet"],
              check=True,
          )
          report = json.load(open("django.json"))
          found = {f["id"] for f in report["findings"]}
          shape = report["project_shape"]
          signals = report["signals"]

          if "Django" not in shape["frameworks"] or not shape["web"]:
              print(f"Django project not recognised as a web surface: {shape}")
              sys.exit(1)

          # Personal data must be found in Django ORM declarations, not just
          # Prisma schemas.
          pii = {s["name"] for s in signals if s["kind"] == "personal_data"}
          for field in ("Email address", "Date of birth", "IP address"):
              if field not in pii:
                  print(f"Django ORM field not detected: {field}")
                  sys.exit(1)

          # Launch-readiness and accessibility must work on server-rendered
          # templates, not only on JSX.
          expected = {
              "launch.og-tags-missing", "launch.framework-title",
              "launch.insecure-assets", "launch.pre-ticked-consent",
              "a11y.img-missing-alt", "a11y.div-as-button",
              "a11y.focus-removed", "a11y.placeholder-as-label",
          }
          missing = sorted(expected - found)
          if missing:
              print("Checks that do not work on Django templates:")
              for item in missing:
                  print(f"  - {item}")
              sys.exit(1)

          print("Cross-stack checks fired on Django templates.")
          PY

      # The false-positive guard. A library with no web surface, no personal
      # data and no services must stay quiet -- a scanner that cries wolf is a
      # scanner people switch off.
      - name: Check the library fixture stays quiet
        run: |
          python3 - <<'PY'
          import json, subprocess, sys

          subprocess.run(
              [sys.executable, "launch-compliance/scripts/scan.py",
               "examples/demo-library", "--out", "lib.json", "--quiet"],
              check=True,
          )
          report = json.load(open("lib.json"))
          found = {f["id"] for f in report["findings"]}

          # SECURITY.md is legitimate advice for any public repository.
          allowed = {"docs.security-missing"}
          noise = sorted(found - allowed)
          if noise:
              print("False positives on a library with no web surface:")
              for item in noise:
                  print(f"  - {item}")
              sys.exit(1)

          shape = report["project_shape"]
          if shape["web"]:
              print(f"Library fixture misclassified as web: {shape}")
              sys.exit(1)

          print(f"Library fixture clean: {sorted(found)}")
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-scan
          path: |
            scan.md
            scan.json
            demo-scan.md
          if-no-files-found: warn
